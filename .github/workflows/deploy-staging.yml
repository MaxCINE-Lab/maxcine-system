name: Deploy Staging

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_API_BASE_URL: https://maxcine-api-staging.maxcine-lab.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Check required Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and security tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Apply staging D1 migrations
        run: npx wrangler d1 migrations apply maxcine-staging-db --remote --env staging --config apps/api/wrangler.toml

      - name: Deploy staging API Worker
        run: npx wrangler deploy --env staging --config apps/api/wrangler.toml

      - name: Build staging Web
        run: npm run build -w @maxcine/web

      - name: Deploy staging Pages
        run: npx wrangler pages deploy apps/web/dist --project-name maxcine-web-staging --branch deploy/staging
