name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy-production to confirm an intentional production deployment.'
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.inputs.confirm == 'deploy-production' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Check required Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and security tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply maxcine-production-db --remote --env production --config apps/api/wrangler.toml

      - name: Apply production base seed
        run: npx wrangler d1 execute maxcine-production-db --remote --env production --config apps/api/wrangler.toml --file apps/api/seed/0002_production_base.sql

      - name: Deploy production API Worker
        run: npx wrangler deploy --env production --config apps/api/wrangler.toml

      - name: Build production Web
        run: npm run build -w @maxcine/web

      - name: Deploy production Pages
        run: npx wrangler pages deploy apps/web/dist --project-name maxcine-web --branch main
