name: Customer Delivery Cloud Acceptance

on:
  push:
    branches: ['codex/customer-delivery-4a']
  workflow_dispatch:
    inputs:
      staging_acceptance:
        description: 'Run Staging browser acceptance after deployment'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: customer-delivery-cloud-staging
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck and targeted lint
        run: |
          npm run typecheck
          npx eslint apps/api/src/index.ts apps/api/src/ukFulfilment.ts apps/api/src/certifiedWarranty.ts apps/api/src/publicWarrantyProjection.ts apps/web/src/UkOrders.tsx apps/web/src/InternationalPortal.tsx apps/web/src/systemNavigation.tsx packages/shared/src/types.ts packages/shared/src/gsx.ts scripts/verify-delivery-staging.mjs tests/phase1_2b_delivery.test.mjs apps/website/warranty-certified.js --max-warnings=0
          npx eslint apps/api/src/rmaIntake.ts apps/api/src/internationalAuthorization.ts apps/web/src/RmaIntake.tsx packages/shared/src/international.ts tests/helpers/deliveryFixture.mjs tests/phase1_2b_rma_intake.test.mjs scripts/verify-rma-staging.mjs --max-warnings=0
          npx eslint apps/api/src/rmaLogistics.ts apps/web/src/ReturnReceiving.tsx tests/phase1_2b_return_logistics.test.mjs scripts/verify-return-logistics-staging.mjs --max-warnings=0
          npx eslint apps/api/src/rmaInspection.ts apps/web/src/ReturnInspection.tsx tests/phase1_2b_return_inspection.test.mjs scripts/verify-return-inspection-staging.mjs --max-warnings=0
          npx eslint apps/api/src/rmaResolution.ts apps/web/src/RmaResolution.tsx tests/phase1_2b_rma_resolution.test.mjs scripts/verify-rma-resolution-staging.mjs --max-warnings=0
          npx eslint apps/api/src/rmaRepair.ts apps/web/src/RmaRepair.tsx tests/phase1_2b_rma_repair.test.mjs scripts/verify-rma-repair-staging.mjs --max-warnings=0
          npx eslint apps/api/src/certifiedInspectionPrimitives.ts apps/api/src/postRepairRecertification.ts apps/web/src/PostRepairRecertification.tsx tests/helpers/postRepairFixture.mjs tests/phase1_2b_post_repair.test.mjs scripts/verify-post-repair-staging.mjs --max-warnings=0
          npx eslint apps/api/src/rmaCustomerReturnRelease.ts apps/api/src/rmaIntake.ts apps/web/src/CustomerReturnRelease.tsx apps/web/src/RmaIntake.tsx apps/web/src/systemNavigation.tsx packages/shared/src/types.ts tests/phase1_2b_customer_return_release.test.mjs --max-warnings=0
          npx eslint apps/api/src/rmaReplace.ts apps/web/src/RmaReplacement.tsx tests/helpers/replaceFixture.mjs tests/phase1_2b_rma_replace.test.mjs scripts/verify-rma-replace-staging.mjs --max-warnings=0
      - name: Core and operations regression suites
        run: |
          npm run test:phase1-2a
          npm run test:phase1-2b-certified
          npm run test:phase1-2b-transfer
          npm run test:phase1-2b-uk-receive
          npm run test:phase1-2b-uk-ship
          npm run test:phase1-2b-delivery
          npm run test:phase1-2b-rma-intake
          npm run test:phase1-2b-return-logistics
          npm run test:phase1-2b-return-inspection
          npm run test:phase1-2b-rma-resolution
          npm run test:phase1-2b-rma-repair
          npm run test:phase1-2b-post-repair
          npm run test:phase1-2b-customer-return-release
          npm run test:phase1-2b-rma-replace
      - name: Security suite
        run: npm test
      - name: Web and API build
        run: |
          npm run build -w @maxcine/web
          npm run build -w @maxcine/api
          npm run build -w @maxcine/website
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: General E2E regression
        env:
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          EMAIL_PROVIDER: mock
        run: npm run test:e2e
      - name: Staging Post-Repair Re-Certification browser acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.staging_acceptance
        run: node scripts/verify-post-repair-staging.mjs
      - name: Save Post-Repair Re-Certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-repair-staging-evidence
          path: test-results/post-repair-staging/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save RMA Repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rma-repair-staging-evidence
          path: test-results/rma-repair-staging/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save RMA Resolution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rma-resolution-staging-evidence
          path: test-results/rma-resolution-staging/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save Return Inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: return-inspection-staging-evidence
          path: test-results/return-inspection-staging/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-delivery-staging-evidence
          path: test-results/delivery-staging/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save Return Logistics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: return-logistics-staging-evidence
          path: test-results/return-logistics-staging/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save RMA acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rma-intake-staging-evidence
          path: test-results/rma-staging/
          if-no-files-found: ignore
          retention-days: 14
