<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>设备信息与权益查询 | MaxCINE</title>
    <meta name="description" content="通过 MaxCINE Public Warranty API 查询设备公开保修状态、保修日期和公开备注。">
    <link rel="canonical" href="https://maxcine-website-staging.pages.dev/warranty.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="MaxCINE 设备信息与权益查询">
    <meta property="og:description" content="通过序列号查询 MaxCINE 产品公开保修状态。">
    <meta property="og:image" content="https://maxcine-website-staging.pages.dev/assets/optimized/hero-poster-desktop.jpg">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="/assets/logo2.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-page="warranty">
    <header class="site-header" data-site-header></header>
    <main id="main-content">
      <section class="page-hero compact-hero warranty-hero">
        <h1>设备信息与权益查询</h1>
        <p>输入 MaxCINE 产品序列号，查询公开保修状态、起止时间与设备权益信息。</p>
      </section>

      <section class="warranty-shell section" aria-labelledby="warranty-form-title">
        <div class="warranty-panel">
          <div>
            <h2 id="warranty-form-title">查询设备</h2>
            <p>先完成滑块验证，再输入序列号进行查询。</p>
          </div>
          <div class="slider-box">
            <label for="slider-input">请将滑块拖到最右端</label>
            <input id="slider-input" type="range" min="0" max="100" value="0">
            <small id="slider-status">未完成验证</small>
          </div>
          <div class="sn-form">
            <label for="sn-input">产品序列号</label>
            <div class="sn-row">
              <input id="sn-input" autocomplete="off" inputmode="latin" placeholder="请输入序列号">
              <button id="sn-btn" class="button glass-control glass-control-primary warranty-submit" type="button">
                <span class="btn-text">查询</span>
                <span class="btn-loader" aria-hidden="true"></span>
                <span class="btn-check" aria-hidden="true">✓</span>
              </button>
            </div>
            <p id="message" class="form-message" aria-live="polite"></p>
          </div>
        </div>

        <aside id="main" class="warranty-result" aria-live="polite">
          <div class="result-media">
            <img id="img" src="/assets/logo2.png" alt="">
          </div>
          <div>
            <h2 id="name">MaxCINE 产品</h2>
            <p id="sn"></p>
            <p id="date"></p>
          </div>
          <dl>
            <div><dt>保修状态</dt><dd id="status"></dd></div>
            <div><dt>保修开始</dt><dd id="start"></dd></div>
            <div><dt>保修结束</dt><dd id="end"></dd></div>
            <div><dt>公开售后记录</dt><dd id="repair"></dd></div>
          </dl>
        </aside>
      </section>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script type="module" src="/script.js"></script>
    <script type="module" src="/warranty.js"></script>
  </body>
</html>
