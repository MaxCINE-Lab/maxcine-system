<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>设备信息查询 | MaxCINE</title>
    <meta name="description" content="通过 MaxCINE Public Warranty API 查询设备公开购买日期、保修状态与权益信息。">
    <link rel="canonical" href="https://maxcine.cn/warranty.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="MaxCINE 设备信息查询">
    <meta property="og:description" content="通过序列号查询 MaxCINE 产品公开保修状态。">
    <meta property="og:image" content="https://maxcine.cn/assets/optimized/hero-poster-desktop.jpg">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="/assets/logo2.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-page="warranty">
    <header class="site-header" data-site-header></header>
    <main id="main-content">
      <section class="page-hero compact-hero warranty-hero">
        <h1>设备信息查询</h1>
        <p>查询产品购买信息、保修状态及服务权益</p>
      </section>

      <section class="warranty-shell section" aria-label="设备信息查询">
        <div class="warranty-panel">
          <div class="sn-form">
            <label for="sn-input">产品序列号</label>
            <input id="sn-input" autocomplete="off" inputmode="latin" pattern="[A-Za-z0-9._\\-/]+" placeholder="请输入产品序列号（SN）">
          </div>
          <div id="slider-box" class="slider-box">
            <label for="slider-input">拖动滑块完成验证</label>
            <div class="slider-track">
              <input id="slider-input" type="range" min="0" max="100" value="0" aria-describedby="slider-status">
            </div>
            <small id="slider-status">拖动滑块完成验证</small>
          </div>
          <div class="warranty-actions">
            <button id="sn-btn" class="button warranty-submit" type="button" disabled>
              <span class="btn-text">查询</span>
              <span class="btn-loader" aria-hidden="true"></span>
              <span class="btn-check" aria-hidden="true">✓</span>
            </button>
            <p id="message" class="form-message" aria-live="polite"></p>
          </div>
        </div>

        <aside id="main" class="warranty-result" aria-live="polite" hidden>
          <div class="result-media">
            <picture>
              <source type="image/avif" srcset="/assets/optimized/product-wide-angle.avif">
              <source type="image/webp" srcset="/assets/optimized/product-wide-angle.webp">
              <img id="img" src="/assets/optimized/product-wide-angle.png" alt="MaxCINE Mavic 4 Pro 增广镜">
            </picture>
          </div>
          <div class="result-intro">
            <h2 id="name">MaxCINE 产品</h2>
            <p id="sn"></p>
            <p id="purchase-date" hidden></p>
          </div>
          <section class="result-card" aria-labelledby="warranty-result-title">
            <h3 id="warranty-result-title">保修期</h3>
            <dl>
              <div><dt>状态</dt><dd id="status"></dd></div>
              <div><dt>保修开始</dt><dd id="start"></dd></div>
              <div><dt>保修结束</dt><dd id="end"></dd></div>
            </dl>
          </section>
          <section id="entitlements-card" class="result-card" hidden aria-labelledby="entitlements-title">
            <h3 id="entitlements-title">额外权益</h3>
            <div id="entitlements" class="entitlement-list"></div>
          </section>
          <section id="service-card" class="result-card" hidden aria-labelledby="service-title">
            <h3 id="service-title">售后服务记录</h3>
            <dl><div><dt>维修记录</dt><dd id="service-record"></dd></div></dl>
          </section>
          <section id="note-card" class="result-card" hidden aria-labelledby="note-title">
            <h3 id="note-title">官网公开备注</h3>
            <p id="repair"></p>
          </section>
        </aside>
      </section>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script type="module" src="/script.js"></script>
    <script type="module" src="/warranty.js"></script>
  </body>
</html>
