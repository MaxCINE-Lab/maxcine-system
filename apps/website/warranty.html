<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>设备信息查询 | MaxCINE</title>
    <meta name="description" content="查询 MaxCINE 设备公开购买信息、保修状态及服务权益。">
    <link rel="canonical" href="https://maxcine.cn/warranty.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="MaxCINE 设备信息查询">
    <meta property="og:description" content="通过序列号查询 MaxCINE 产品公开保修状态。">
    <meta property="og:image" content="https://maxcine.cn/assets/optimized/hero-poster-desktop.jpg">
    <meta name="theme-color" content="#f5f5f5">
    <link rel="icon" href="/assets/logo2.png">
    <link rel="stylesheet" href="/warranty.css">
  </head>
  <body>
    <header class="mc-header">
      <div class="mc-left">
        <a href="/" aria-label="MaxCINE 首页"><img src="/assets/logo2.png" class="mc-logo" alt="MaxCINE"></a>
        <span class="mc-nav-text">设备信息与权益</span>
      </div>
    </header>

    <main class="mc-container">
      <h1>设备信息查询</h1>
      <p class="mc-desc">查询设备购买信息、保修状态及服务权益</p>

      <section class="mc-query" aria-label="设备信息查询">
        <label class="sr-only" for="sn-input">产品序列号</label>
        <input id="sn-input" class="mc-input" autocomplete="off" inputmode="latin" pattern="[A-Za-z0-9._\\-/]+" placeholder="请输入产品序列号（SN）">

        <div id="slider-box" class="mc-slider-box">
          <label class="sr-only" for="slider-input">拖动滑块完成验证</label>
          <div class="mc-slider-track">
            <input id="slider-input" type="range" min="0" max="100" value="0" aria-describedby="slider-status">
          </div>
          <small id="slider-status">拖动滑块完成验证</small>
        </div>

        <button id="sn-btn" class="mc-btn" type="button" disabled>
          <span class="btn-text">查询</span>
          <span class="btn-loader" aria-hidden="true"></span>
          <span class="btn-check" aria-hidden="true">✓</span>
        </button>
        <p id="message" class="mc-message" aria-live="polite"></p>
      </section>

      <section id="main" class="mc-main" aria-live="polite" hidden>
        <img id="img" class="mc-img" src="/assets/optimized/product-wide-angle.png" alt="MaxCINE Mavic 4 Pro 增广镜">
        <h2 id="name">MaxCINE 产品</h2>
        <p id="sn" class="mc-sn"></p>
        <p id="date" class="mc-sn" hidden></p>

        <section class="mc-card" aria-labelledby="warranty-title">
          <h3 id="warranty-title">保修期</h3>
          <div class="mc-row"><span>状态</span><strong id="status"></strong></div>
          <div class="mc-row"><span>保修开始</span><strong id="start"></strong></div>
          <div class="mc-row"><span>保修结束</span><strong id="end"></strong></div>
        </section>

        <section id="entitlements-card" class="mc-card" hidden aria-labelledby="entitlements-title">
          <h3 id="entitlements-title">额外权益</h3>
          <div id="entitlements" class="entitlement-list"></div>
        </section>

        <section id="note-card" class="mc-card" hidden aria-labelledby="note-title">
          <h3 id="note-title">官方备注</h3>
          <p id="repair" class="mc-note"></p>
        </section>
      </section>
    </main>

    <script type="module" src="/warranty.js"></script>
  </body>
</html>
