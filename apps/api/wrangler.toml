name = "maxcine-api"
main = "src/index.ts"
compatibility_date = "2026-07-26"
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "maxcine-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "maxcine-assets"

[vars]
APP_ORIGIN = "http://localhost:5173"
PUBLIC_ORIGIN = "http://localhost:5174"
EMAIL_PROVIDER = "mock"
AI_PROVIDER = "disabled"

[env.staging]
name = "maxcine-api-staging"
workers_dev = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "maxcine-staging-db"
database_id = "d64b8ac9-4e83-4a63-a1af-7bcbccf9087b"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "ASSETS"
bucket_name = "maxcine-assets-staging"

[env.staging.vars]
APP_ORIGIN = "https://maxcine-web-staging.pages.dev"
PUBLIC_ORIGIN = "https://maxcine-website-staging.pages.dev"
COOKIE_SAMESITE = "None"
EMAIL_PROVIDER = "resend"
AI_PROVIDER = "disabled"

[env.production]
name = "maxcine-api"
workers_dev = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "maxcine-production-db"
database_id = "f89d68f9-4d92-41e0-ac77-5e6492153759"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "ASSETS"
bucket_name = "maxcine-assets-production"

[[env.production.routes]]
pattern = "api.maxcine.cn"
custom_domain = true

[env.production.vars]
APP_ORIGIN = "https://dealersystem.maxcine.cn"
PUBLIC_ORIGIN = "https://maxcine-website.pages.dev"
COOKIE_SAMESITE = "None"
EMAIL_PROVIDER = "mock"
AI_PROVIDER = "disabled"
