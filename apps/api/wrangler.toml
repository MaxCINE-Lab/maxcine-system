name = "maxcine-api"
main = "src/index.ts"
compatibility_date = "2026-07-26"
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "maxcine-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "maxcine-assets"

[vars]
APP_ORIGIN = "http://localhost:5173"
EMAIL_PROVIDER = "mock"

[env.staging]
name = "maxcine-api-staging"
workers_dev = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "maxcine-staging-db"
database_id = "d64b8ac9-4e83-4a63-a1af-7bcbccf9087b"
migrations_dir = "migrations"

[env.staging.vars]
APP_ORIGIN = "https://maxcine-web-staging.pages.dev"
COOKIE_SAMESITE = "None"
EMAIL_PROVIDER = "mock"
